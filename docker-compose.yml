services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playgrand}
      POSTGRES_DB: ${POSTGRES_DB:-playgrand}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./back-end
      dockerfile: backend-dockerfile
    container_name: express_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./back-end/.env
    environment:
      API_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-go_database}@db:5432/${POSTGRES_DB:-TestDB}?schema=public
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back-end:/app
      - /app/node_modules
      
volumes:
  postgres_data:
